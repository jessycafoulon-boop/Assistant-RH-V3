<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistant RH</title>
<style>
:root{
  --primary:#2457a6;
  --primary-dark:#173d78;
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#dfe5ee;
  --success:#16794c;
  --shadow:0 12px 35px rgba(23,32,51,.12);
  --radius:18px
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--text)
}
button,input{
  font:inherit
}
.app{
  max-width:920px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column
}
.header{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:24px 24px 22px;
  position:sticky;
  top:0;
  z-index:3
}
.brand{
  display:flex;
  gap:14px;
  align-items:center
}
.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:rgba(255,255,255,.16);
  display:grid;
  place-items:center;
  font-size:24px
}
h1{
  font-size:22px;
  margin:0 0 3px
}
.subtitle{
  font-size:13px;
  opacity:.88
}
.content{
  padding:22px 18px 30px;
  flex:1
}
.welcome{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px
}
.welcome h2{
  font-size:19px;
  margin:0 0 8px
}
.welcome p{
  margin:0;
  color:var(--muted);
  line-height:1.5
}
.suggestions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px
}
.chip{
  border:1px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:9px 13px;
  cursor:pointer;
  color:var(--text)
}
.chip:hover{
  border-color:var(--primary);
  color:var(--primary)
}
.chat{
  display:flex;
  flex-direction:column;
  gap:12px
}
.msg{
  max-width:86%;
  padding:13px 15px;
  border-radius:16px;
  line-height:1.5;
  font-size:14px
}
.bot{
  align-self:flex-start;
  background:#fff;
  border:1px solid var(--border);
  border-bottom-left-radius:5px
}
.user{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
  border-bottom-right-radius:5px
}
.answer{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:0 5px 18px rgba(23,32,51,.06)
}
.answer h3{
  font-size:16px;
  margin:0 0 7px
}
.answer p{
  margin:7px 0;
  color:#344054;
  line-height:1.5
}
.badge{
  display:inline-block;
  background:#eef4ff;
  color:var(--primary-dark);
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  margin-bottom:8px
}
.contact{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#f7f9fc;
  border:1px solid var(--border)
}
.contact strong{
  display:block;
  margin-bottom:4px
}
.contact a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px
}
.action{
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer;
  color:var(--text);
  text-decoration:none;
  font-size:13px
}
.action.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}
/* =========================
   DOCUMENTS
   ========================= */
.document-box{
  margin-top:14px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#f8fafc
}
.document-title{
  font-weight:700;
  margin-bottom:4px
}
.document-description{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px
}
.document-format{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  background:#eef4ff;
  color:var(--primary-dark);
  border-radius:999px;
  padding:4px 8px;
  margin-bottom:8px
}
/* Fenêtre mobile */
.document-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999
}
.document-modal{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:20px;
  padding:25px 20px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  position:relative
}
.document-modal h3{
  margin:0 35px 10px 0;
  font-size:18px
}
.document-modal p{
  color:#475467;
  line-height:1.5;
  font-size:14px
}
.document-icon{
  font-size:38px;
  margin-bottom:10px
}
.document-info{
  background:#f7f9fc;
  border:1px solid var(--border);
  padding:11px;
  border-radius:12px;
  font-size:13px!important
}
.document-close{
  position:absolute;
  right:14px;
  top:14px;
  border:0;
  background:#f2f4f7;
  width:34px;
  height:34px;
  border-radius:50%;
  cursor:pointer;
  font-size:16px
}
.document-actions{
  margin-top:18px
}
.document-actions .action{
  text-align:center
}
/* =========================
   RECHERCHE
   ========================= */
.searchbar{
  position:sticky;
  bottom:0;
  background:rgba(244,247,251,.95);
  backdrop-filter:blur(10px);
  padding:12px 18px 18px;
  border-top:1px solid var(--border)
}
.form{
  display:flex;
  gap:8px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:7px 7px 7px 13px;
  box-shadow:var(--shadow)
}
.form input{
  border:0;
  outline:0;
  flex:1;
  min-width:0;
  color:var(--text);
  background:transparent
}
.send{
  border:0;
  background:var(--primary);
  color:#fff;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700
}
.disclaimer{
  font-size:11px;
  color:var(--muted);
  margin:8px 3px 0;
  text-align:center
}
.hidden{
  display:none!important
}
@media(max-width:600px){
  .header{
    padding:18px
  }
  .content{
    padding:15px 12px 24px
  }
  .searchbar{
    padding:10px 12px 15px
  }
  .msg{
    max-width:94%
  }
  .document-overlay{
    align-items:flex-end;
    padding:10px
  }
  .document-modal{
    border-radius:20px 20px 12px 12px;
    padding:22px 17px 17px
  }
}
</style>
</head>
